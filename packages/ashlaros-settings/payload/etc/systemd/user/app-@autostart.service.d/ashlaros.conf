# Every unit systemd-xdg-autostart-generator makes from an XDG autostart
# entry - /etc/xdg/autostart and ~/.config/autostart, app-<name>@autostart.
#
# Those entries used to be run by dex from sway's config, which started
# them into the login scope. logind leaves that scope running on logout, so
# each re-login added another copy of every tray applet next to the one the
# previous session never stopped. As units they stop with the session.
#
# The generator ties them to graphical-session.target only; sway-session is
# the one session.sh stops, and the one everything else here is PartOf.
[Unit]
PartOf=sway-session.target
After=sway-session.target

[Service]
# Most of these are tray applets, and the bar hosts the tray: the same wait
# dex did before starting any of them. Bounded, and its failure ignored, so
# an entry still starts in a session whose bar did not come up.
ExecStartPre=-/usr/bin/gdbus wait --session --timeout 30 org.kde.StatusNotifierWatcher
