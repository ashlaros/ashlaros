#
# pattern: Can either be the exact "app_name" (app_id/class) of the window or a regex string in the format of `"/{regex}/"` which will match the window "title".
# icon: Your beatiful icon
#
# verbose format:
#
# '{pattern}' = { type = 'generic' | 'exact', value = '{icon}' }
#
#
# If it couldn't match something it will print:
#
# WARN [sworkstyle:config] No match for '{app_name}' with title '{title}'
#
# You can use {title} to do a generic matching
# You can use {app_name} to do an exact match
# You can find icons for nerd fonts here: https://www.nerdfonts.com/cheat-sheet
# Anything added in here will override the defaults in the package.
#
# sworkstyle compiles a default table in (default_config.toml upstream),
# and it already covers firefox, foot, the terminals and the usual GUI
# applications - so this file is for what it does not know rather than a
# second copy of what it does. The entries below are the applications
# AshlarOS ships that upstream has no icon for; without them the daemon
# logs "No match" and the workspace shows the generic fallback.

[matching]
# The file manager the installer puts on every desktop.
'pcmanfm-qt' = ''
# The settings TUI and the installer's own dashboard both run in foot with
# a set app-id; matched by title so they read as themselves rather than as
# a terminal.
'/(?i)ashlaros.settings/' = ''
'floating_shell' = ''
