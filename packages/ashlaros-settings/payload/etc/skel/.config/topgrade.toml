# topgrade is what the bar's update button runs.
#
# Yours to edit: nothing regenerates this file. The defaults below are the
# ones that would otherwise have to live in a user's head.

[misc]
# The binary comes from pacman, so a self-update would replace a packaged
# file behind pacman's back - the next -Syu would then either revert it or
# report a conflict. Updates arrive as package updates.
no_self_update = true

# Ask before each step rather than assuming yes: this runs ~200 updaters
# and some of them touch things a user did not expect to be in scope.
# assume_yes = true

# Steps to skip entirely, by name. A step with nothing to do costs a
# subprocess and prints one line, so only what would do the wrong thing is
# here.
# mise: topgrade's step runs `mise self-update` whenever `mise --help`
# lists it, then `mise upgrade`. mise is a pacman package here - the same
# objection as no_self_update above - and both builds we install refuse:
# Arch's has self-update compiled out ("disabled at build time") yet still
# lists the command, mise-bin ships the .disable-self-update marker. Either
# way the self-update exits 1, topgrade fails the step there and never
# reaches `mise upgrade`, so the tools did not update either. [commands]
# below runs the tools half on its own.
disable = ["mise"]

[linux]
# yay ships on every x86_64 desktop (DESKTOP_PACKAGES), so AUR packages are
# updated alongside the repository ones rather than silently left behind.
arch_package_manager = "yay"

# The Arch news is worth reading before a -Syu breaks something; it is the
# one place a manual intervention gets announced.
show_arch_news = true

[commands]
# The half of topgrade's mise step worth keeping: the tools mise installed,
# not mise itself. Skipped quietly where mise is not installed.
"mise tools" = "command -v mise >/dev/null || exit 0; mise plugins update && mise upgrade"
