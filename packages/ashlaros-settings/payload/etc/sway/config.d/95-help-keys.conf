# Four bars that are never drawn, one per modifier: how the keybinding help
# overlay learns what is held (#89). sway has no IPC event for a keypress,
# but it re-evaluates every bar's `modifier` on each modifier change and
# sends bar_state_update when that bar's goes up or down.
# usr/share/sway/scripts/help-keys.sh subscribes to those.
#
# swaybar_command /bin/true: sway still forks it, once per bar per reload,
# and it exits at once - there is no bar process and nothing on screen.
# One bar per modifier rather than a combined one: sway's test is "all of
# this bar's modifiers are held", so a Mod4+Shift bar would only ever say
# both-or-not, never which.
#
# Nothing here binds a key. Waybar is not affected: it reads the bar events
# addressed to its own id and ignores these.
bar {
    id help-keys-super
    modifier Mod4
    mode hide
    hidden_state hide
    swaybar_command /bin/true
}
bar {
    id help-keys-shift
    modifier Shift
    mode hide
    hidden_state hide
    swaybar_command /bin/true
}
bar {
    id help-keys-ctrl
    modifier Ctrl
    mode hide
    hidden_state hide
    swaybar_command /bin/true
}
bar {
    id help-keys-alt
    modifier Mod1
    mode hide
    hidden_state hide
    swaybar_command /bin/true
}
