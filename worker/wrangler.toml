name = "ashlaros-web"
main = "src/index.js"
compatibility_date = "2026-09-10"
# the login sees several accounts; pin the one owning the buckets so a
# deploy can never bind an empty bucket on the wrong account
account_id = "fc8102dae7e1eb7a1ecec012dcb0dfaf"

# One worker, both sites: they serve the same shape and differ only in
# bucket, key validation, index and caching. Routing is by hostname, and
# each site reads only its own binding.
#
# Custom domains rather than routes: cloudflare provisions the DNS record
# and certificate, and the zone lives in the same account as the worker.
routes = [
  # A route, not a custom domain: the apex already carries DNS records the
  # zone manages, and a custom domain refuses to take a hostname that has
  # them ("already has externally managed DNS records"). A route on the
  # proxied hostname runs ahead of whatever those records point at, which
  # is what makes the apex stop answering 525.
  { pattern = "ashlaros.download/*", zone_name = "ashlaros.download" },
  { pattern = "www.ashlaros.download/*", zone_name = "ashlaros.download" },
  { pattern = "packages.ashlaros.download", custom_domain = true },
  { pattern = "iso.ashlaros.download", custom_domain = true },
]

# The landing page, served from the repository rather than copied into a
# JS module, so the page and its assets have exactly one source. The worker
# runs first and hands the apex to this binding; the two bucket hostnames
# never touch it.
[assets]
directory = "../docs"
binding = "DOCS"
run_worker_first = true

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "ashlaros"

[[r2_buckets]]
binding = "ISO"
bucket_name = "ashlaros-iso"

# Download counting. Writes need no credentials - writeDataPoint goes
# through the binding - so downloads are recorded whether or not the read
# token is set, and the token can be added later without losing anything
# already counted.
[[analytics_engine_datasets]]
binding = "ANALYTICS_ENGINE"
dataset = "ashlaros-iso-downloads"

# Analytics engine keeps three months. A cron on the 2nd - not the 1st,
# because a closed month's last events must be queryable before it is
# archived and ingestion is not instant - rolls each closed month into one
# key here, which is kept indefinitely.
[[kv_namespaces]]
binding = "STATS"
id = "8304376d0f2a4e5aa4302eb1061cd04c"

[triggers]
crons = ["17 3 2 * *"]

[vars]
# not a secret: the account id is already in this file in plaintext above.
# ANALYTICS_TOKEN is the secret, and goes in with `wrangler secret put`.
ACCOUNT_ID = "fc8102dae7e1eb7a1ecec012dcb0dfaf"
