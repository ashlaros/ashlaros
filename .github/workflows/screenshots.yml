name: screenshots

on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [main]
    paths:
      - screenshots/**
      - .github/workflows/screenshots.yml
  # build-packages dispatches this once the packages it built are published.
  #
  # A push touching packages/ used to start this job and build-packages at
  # the same moment, and setup.sh installs ashlaros-settings from the
  # published repository - so the picture showed the *previous* build. The
  # fix for the help overlay in f013b8b was photographed that way: the job
  # went green over a screenshot of the bug it had just fixed.
  #
  # Same reasoning and same mechanism as the iso job in build-packages.yml,
  # which is dispatched from there for exactly this reason.
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # Arch's sway carries cap_sys_nice=ep, and exec'ing a file whose
      # capability is outside the bounding set fails with EPERM - even as
      # root, which reads like a corrupt binary rather than a missing
      # capability. Not --privileged: one capability is what is needed.
      options: --cap-add=SYS_NICE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the desktop
        # from the published repository, not from this checkout: the picture
        # should show what users can install today
        # github.workspace is the host path; inside a job container the
        # checkout is mounted somewhere else entirely, and $PWD is the only
        # name that is right on both sides
        run: OUT_DIR="$PWD/out" screenshots/setup.sh
      - name: capture
        # the checkout is root-owned and the shots are taken as a user, so
        # the manifest is read from the repository and only the output
        # directory is handed over
        run: |
          su ashlar -c "MANIFEST=$PWD/screenshots/shots.yaml \
            $PWD/screenshots/capture.sh $PWD/out"
      - name: record the tour
        # ffmpeg for the duration check record.sh makes before declaring
        # success; wf-recorder is already a settings dependency
        run: |
          pacman -S --noconfirm --needed wf-recorder ffmpeg
          su ashlar -c "SCENES=$PWD/screenshots/scenes.yaml \
            $PWD/screenshots/record.sh $PWD/out"
      - name: upload to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ashlaros-iso
        run: |
          pacman -S --noconfirm --needed python-boto3
          python3 scripts/upload_screenshots.py --shot-dir out
      - name: keep the shots when something looks wrong
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: |
            out/*.png
            out/*.webm
            out/*.log
          if-no-files-found: warn
          retention-days: 7
