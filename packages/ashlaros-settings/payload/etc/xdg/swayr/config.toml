# The desktop's menu, fuzzel, in dmenu mode. It themes itself from
# ~/.config/fuzzel, so nothing here names a font or a colour.
[menu]
executable = 'fuzzel'
args = [
    '--dmenu',
    '--prompt', '{prompt}: ',
    '--width', '90',
]

# Plain text, because fuzzel draws no markup: every <b>, <i> and <span> the
# rofi rows carried would be printed as it is. So the structure a bold face
# gave is words and separators instead, and the id rofi faded to 20% alpha is
# gone - swayr matches the chosen row back to its window itself, and the id
# is not something anyone picks by.
#
# The icon stays: fuzzel reads rofi's \0icon\x1f<path> row suffix. It has to
# be a double-quoted TOML string for the escapes to be processed.
[format]
output_format = '{indent}Output {name}'
workspace_format = '{indent}Workspace {name} [{layout}] on {output_name}'
container_format = '{indent}Container [{layout}] {marks} on workspace {workspace_name}'
window_format = "{indent}{urgency_start}{app_name} — {title}{urgency_end}   {marks}  workspace {workspace_name} · {output_name}\u0000icon\u001f{app_icon}"
indent = '    '
# a marker rather than a colour, since there is no colour to give it
urgency_start = '! '
urgency_end = ''
# off with the markup: escaping only matters to a menu that parses tags, and
# fuzzel would show a title's "&" as "&amp;"
html_escape = false
icon_dirs = [
    '/usr/share/icons/Papirus-Dark/64x64/apps',
    '/usr/share/icons/Papirus-Dark/48x48/apps',
    '/usr/share/icons/hicolor/scalable/apps',
    '/usr/share/icons/hicolor/64x64/apps',
    '/usr/share/icons/hicolor/48x48/apps',
    '/usr/share/icons/Adwaita/64x64/apps',
    '/usr/share/icons/Adwaita/48x48/apps',
    '/usr/share/pixmaps',
]

[layout]
auto_tile = false
auto_tile_min_window_width_per_output_width = [
    [1024, 500],
    [1280, 600],
    [1400, 680],
    [1440, 700],
    [1600, 780],
    [1920, 920],
    [2560, 1000],
    [3440, 1000],
    [4096, 1200],
]

[focus]
lockin_delay = 750

[misc]
auto_nop_delay = 3000
seq_inhibit = false
