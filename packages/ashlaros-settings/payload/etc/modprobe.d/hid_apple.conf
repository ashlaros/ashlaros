# F-keys act as F-keys, not as media keys.
#
# hid_apple drives Apple keyboards and the many third-party boards that
# present as one - Keychron and Lofree among them - so this is a class of
# keyboard rather than one machine's quirk, which is why it ships when the
# per-model fixes deliberately do not.
#
# fnmode=2 means the function-key row is F1-F12 and Fn reaches the media
# keys. The module's default is 1, the other way round, which surprises
# anyone who did not buy a Mac.
#
# Inert on every machine without such a keyboard: the module is never
# loaded, so the option is never read.
options hid_apple fnmode=2
