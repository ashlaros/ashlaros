# Focus flashing. A shell fragment, sourced by
# /usr/share/sway/scripts/flashfocus.sh.
#
# Copy to ~/.config/sway/flashfocus.conf to change any of it; that file is
# sourced after this one, so it only needs the lines it changes.

# Opacity a window drops to when it takes focus.
flash_opacity=0.8

# What it is restored to afterwards.
default_opacity=1

# Length of the flash, in milliseconds.
time_ms=300

# Frames in the ramp. Eight over 300 ms is finer than most displays resolve,
# and each frame costs a swaymsg, so this is the knob that decides how much
# work a focus change does.
ntimepoints=8

# true drops the opacity and restores it with no ramp: four processes per
# flash instead of about forty.
simple=false

# Turn flashing off entirely without disabling the unit.
flash_on_focus=true

# Fullscreen windows are usually video; flashing them is distracting.
flash_fullscreen=false
