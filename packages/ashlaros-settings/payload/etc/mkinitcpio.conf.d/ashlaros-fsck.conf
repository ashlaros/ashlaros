# fsck.btrfs is a shell script (#!/bin/sh -f), and the systemd initramfs
# carries no shell. The fsck hook adds the helper for the root filesystem
# but not its interpreter, so every boot logged
#   fsck: /usr/bin/fsck.btrfs: execute failed: No such file or directory
#   fsck failed with exit status 8. Ignoring error.
# from systemd-fsck on the root. The helper itself does nothing for btrfs -
# it exits 0 under -a, since btrfs checks itself on mount - which is
# exactly the result it should report. The same applies to fsck.xfs.
#
# sh resolves to bash here, and add_binary pulls in its libraries. A
# drop-in rather than an edit to mkinitcpio.conf, which pacman owns and the
# installer already rewrites for HOOKS.
BINARIES+=(sh)
