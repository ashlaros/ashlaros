# gruvbox
#
# gruvbox-material's dark palette at medium contrast - sainnhe/gruvbox-material,
# MIT - which is the gruvbox omarchy ships (themes/gruvbox/colors.toml): the
# softened foreground and the muted accents rather than morhetz's original
# saturated ones. Its accent is omarchy's too, the blue #7daea3, at 5.9:1
# on the background; the text is 8.2:1 and the error red 4.7:1.
#
# The $colorN slots follow the ashlaros and matcha layout, not a terminal's,
# because that is what the desktop reads them as: $color8 is an error to
# waybar, aerc and swaylock, $color9 a warning, $color1 swaylock's resting
# ring, $color5 and $color10 the text and keys in a mode's banner.
#
# GTK and Qt are not themed to match, for the reason hackerman gives: no
# gruvbox GTK or Kvantum theme is packaged anywhere we can depend on, and
# the AUR's are unmaintained -git builds. adw-gtk3 dark keeps GTK apps
# neutral, which suits gruvbox's warm greys better than a blue Adwaita.

# some global theme specific variables
set $gtk-theme adw-gtk3-dark
set $icon-theme Papirus-Dark
set $cursor-theme phinger-cursors-light
set $gui-font Roboto 11
set $term-font JetBrainsMono NF
set $gtk-color-scheme prefer-dark
set $kvantum-theme KvGnomeDark
set $vscode-theme "Noctis Obscuro"

set $bg0    #282828
set $bg1    #32302f
set $bg3    #45403d
set $bg5    #5a524c
set $fg0    #d4be98
set $grey0  #7c6f64
set $grey2  #a89984
set $red    #ea6962
set $orange #e78a4e
set $yellow #d8a657
set $green  #a9b665
set $aqua   #89b482
set $blue   #7daea3
set $purple #d3869b

set $color0  $bg0
set $color1  $bg1
set $color3  $bg5
set $color5  $grey2
set $color6  $fg0
set $color7  #ddc7a1
set $color8  $red
set $color9  $orange
set $color10 $yellow
set $color11 $green
set $color12 $blue
set $color13 $aqua

set $background-color $bg0
set $text-color $fg0
set $selection-color $bg3
set $accent-color $blue

# The focused border is the accent; everything unfocused sits in the
# background greys, so the one blue window is the one with the keyboard.
# target                 title   bg    text   indicator border
client.focused           $blue   $blue $bg0   $aqua     $blue
client.focused_inactive  $bg3    $bg3  $fg0   $bg5      $bg3
client.unfocused         $bg1    $bg0  $grey2 $bg5      $bg1
client.urgent            $red    $red  $bg0   $orange   $red
client.placeholder       $bg0    $bg0  $grey2 $bg0      $bg0
client.background        $bg0
