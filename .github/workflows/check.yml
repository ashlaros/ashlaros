name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: test
        # the task adds the wasm target the tests compile against, so a
        # workstation and a runner run the same thing
        run: mise run test

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: rustup target add wasm32-unknown-unknown
      - name: build the wasm the worker imports
        run: cargo build --release --manifest-path core/Cargo.toml --target wasm32-unknown-unknown
      - name: the two targets must agree
        # One implementation compiled twice is only true if it is checked.
        # A native player whose run scores differently under the verifier
        # is worse than no leaderboard: it refuses honest runs and cannot
        # tell them from forged ones.
        run: |
          cargo test --manifest-path core/Cargo.toml
          node ci/cross-target.mjs
          cp core/target/native-results.txt /tmp/x86_64-results.txt
      - name: aarch64 must agree with x86_64
        # The distribution is dual-arch, so "the same everywhere" has to
        # include the other architecture a player might be running. The
        # wasm check above says nothing about it: aarch64 is a third code
        # generator, and the one shipped in the ARM package.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
          rustup target add aarch64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo test --release --manifest-path core/Cargo.toml \
            --target aarch64-unknown-linux-gnu --no-run
          binary=$(find core/target/aarch64-unknown-linux-gnu/release/deps \
            -name 'cross_target-*' -type f -executable | head -1)
          QEMU_LD_PREFIX=/usr/aarch64-linux-gnu qemu-aarch64-static "$binary"
          diff /tmp/x86_64-results.txt core/target/native-results.txt \
            && echo "aarch64 and x86_64 agree" 

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: raylib
        # the client links the system library rather than vendoring one,
        # so the build needs it present - as it is in Arch and ALARM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: build raylib 6.0
        run: |
          curl -sSL https://github.com/raysan5/raylib/archive/refs/tags/6.0.tar.gz | tar xz
          # shared, as Arch ships it: a static libraylib.a leaves every
          # X11 symbol for the final link to resolve, which is a problem
          # the packaged build does not have
          cmake -S raylib-6.0 -B /tmp/rb -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/rb -j"$(nproc)"
          sudo cmake --install /tmp/rb
          sudo ldconfig
      - name: build the client
        # /usr/local/lib is not on Ubuntu's default link path, where Arch
        # would have raylib in /usr/lib and need none of this
        env:
          LIBRARY_PATH: /usr/local/lib
          RAYLIB_INCLUDE_PATH: /usr/local/include
        run: cargo build --release --manifest-path client/Cargo.toml

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: shellcheck
        # Every shell script in the tree, found by shebang rather than by a
        # hand-written list. The list drifted: eight shipped scripts were
        # never checked, among them clipboard and taildrop-send, and termbin
        # had a backtick that ran the package name as a command instead of
        # printing it. A file nobody lists is a file nobody fails on.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          mapfile -t files < <(python3 scripts/shell_sources.py)
          echo "checking ${#files[@]} shell scripts"
          shellcheck --severity=warning "${files[@]}"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: ruff
        # the paths live in mise.toml's lint task, so a workstation and a
        # runner lint the same files
        run: mise run lint
      - name: the worker's style copies match docs/
        # docs/site.css is the one stylesheet; the worker carries its bytes
        # because docs/ is bound as assets on the apex alone. A stale copy
        # means packages. and iso. render with last week's design.
        run: python3 scripts/generate_style_module.py --check
      - name: the landing page matches shots.yaml
        # the gallery is generated, so a shot added to the capture list
        # without a re-run would be published and never shown
        run: |
          mise run install
          python3 scripts/generate_gallery.py --check

  arm-repo:
    # The aarch64 half of the repository has no other test: the ISO is
    # x86_64 only, so nothing else ever installs an ashlaros package on ARM.
    # A native ARM runner is the only place this can run - qemu-user under
    # rootless docker cannot register binfmt.
    runs-on: ubuntu-24.04-arm
    container: menci/archlinuxarm:base
    steps:
      - name: an ARM machine can install from the repository
        run: |
          # pacman 7 confines downloads with Landlock; this container's
          # seccomp profile blocks the syscalls, failing every sync with
          # "the Landlock ruleset could not be applied". Same probe the
          # build containers use - keep the isolation where it works.
          if ! pacman -Sy --noconfirm >/dev/null 2>&1; then
            sed -i '0,/^\[options\]/s//[options]\nDisableSandbox/' /etc/pacman.conf
          fi
          pacman -Sy --noconfirm --needed curl >/dev/null
          curl -fsSL "${REPO_URL}/ashlaros.gpg" -o /tmp/ashlaros.gpg
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman-key --add /tmp/ashlaros.gpg
          gpg --show-keys --with-colons /tmp/ashlaros.gpg |
            awk -F: '/^fpr:/ {print $10}' |
            while read -r fingerprint; do pacman-key --lsign-key "$fingerprint"; done
          printf '\n[ashlaros]\nSigLevel = Required DatabaseOptional\nServer = %s/$arch\n' \
            "$REPO_URL" >> /etc/pacman.conf
          pacman -Sy

          # against Arch Linux ARM's own core/extra, which is what an ARM
          # user actually runs underneath this repository
          pacman -S --noconfirm ashlaros-settings
          pacman -Q ashlaros-settings ashlaros-branding
          test -f /etc/sway/config
    env:
      REPO_URL: ${{ vars.REPO_URL || 'https://ashlaros.download/packages' }}

  packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: install git before the checkout
        # Without git in the image, actions/checkout downloads a tarball
        # through the REST API and there is no .git at all - so fetch-depth
        # is ignored, every git command fails, and the diff below silently
        # falls back to verifying all 33 packages. Same pattern
        # rebuild-on-breakage.yml already uses.
        run: pacman -Sy --noconfirm --needed git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the diff below needs the base commit to compare against
          fetch-depth: 0
      # SRCDEST, so a source already downloaded is reused rather than
      # refetched. Keyed on the PKGBUILDs themselves: a changed sha256sum
      # misses the key and refetches, which is what keeps the check honest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/makepkg/src
          key: makepkg-src-${{ hashFiles('packages/*/PKGBUILD') }}
          restore-keys: makepkg-src-
      - name: every PKGBUILD parses and its checksums match its sources
        # a stale sha256sum fails the build twenty minutes in; catch it here
        #
        # Only the packages this push touched. --verifysource downloads
        # every source to check it, and running that over all of them on
        # every push put real traffic on the upstreams that host them -
        # enough that a maintainer saw it in their download counts and
        # asked us to stop (#81). Most pushes touch no package at all.
        run: |
          # git is already here from the pre-checkout step; pacman-contrib
          # is what makepkg wants for several PKGBUILDs that take git+
          # sources
          pacman -Sy --noconfirm --needed pacman-contrib git >/dev/null
          # The container runs as root over a checkout the runner made, so
          # git refuses it as dubiously owned and every later command fails
          # in a way that looks like "the object is missing". '*' rather
          # than $PWD because GITHUB_WORKSPACE and the container's cwd are
          # not always the same path.
          git config --global --add safe.directory '*'
          echo "HEAD is $(git rev-parse HEAD 2>&1)"

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit in the event; verifying everything"
            changed=$(printf '%s\n' packages/*/PKGBUILD)
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # The base can be absent from a shallow or partial clone. Ask the
            # remote for it rather than falling back to all 33 packages,
            # which is the traffic this change exists to stop.
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
            if git cat-file -e "$base^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$base" HEAD -- 'packages/*/PKGBUILD')
            else
              echo "base $base is unreachable even after a fetch; verifying everything"
              changed=$(printf '%s\n' packages/*/PKGBUILD)
            fi
          else
            changed=$(git diff --name-only "$base" HEAD -- 'packages/*/PKGBUILD')
          fi

          if [ -z "$changed" ]; then
            echo "no PKGBUILD changed; nothing to verify"
            exit 0
          fi

          mkdir -p /var/cache/makepkg/src
          useradd -m builder
          chown -R builder:builder . /var/cache/makepkg/src
          fail=0
          for pkgbuild in $changed; do
            [ -f "$pkgbuild" ] || continue
            dir=$(dirname "$pkgbuild")
            echo "verifying $dir"
            if ! sudo -u builder SRCDEST=/var/cache/makepkg/src \
              bash -c "cd '$dir' && makepkg --verifysource --noconfirm --skippgpcheck" >/dev/null 2>&1; then
              echo "::error file=$pkgbuild::sources do not verify"
              fail=1
            fi
          done
          exit $fail
