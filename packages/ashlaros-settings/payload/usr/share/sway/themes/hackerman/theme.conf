# hackerman
#
# The visual system of boredland/slopduel: near-black void, acid green,
# brutalist mono. The distribution's own theme is monochrome stone; this is
# the other end of the range, which is what the theme switcher is for.
#
# GTK and Qt are deliberately not themed to match. No GTK or Kvantum theme
# exists in this palette and authoring one is a different job from a sway
# colour scheme, so this reuses adw-gtk-theme dark and GTK apps stay
# neutral. That mismatch is a choice, not a bug.
#
# Everything in `packages` is in extra, so this theme needs nothing we
# build ourselves.

# some global theme specific variables
set $gtk-theme adw-gtk3-dark
set $icon-theme Papirus-Dark
set $gui-font JetBrainsMono NF 11
set $term-font JetBrainsMono NF
set $gtk-color-scheme prefer-dark
set $kvantum-theme KvAdaptaDark
set $background $HOME/.config/sway/generated_background.svg
set $cursor-theme phinger-cursors-light
set $vscode-theme "Noctis Obscuro"

# slopduel's app/style.css, verbatim
set $void #0d0d12
set $panel #16161f
set $edge #2a2a38
set $edge-strong #646480
set $sludge #b5e853
set $error-pink #ff3366
set $bone #e6e6e6
set $muted #8a8a9e

# ANSI colors
#
# Eight palette colours, sixteen terminal slots. The missing ones are
# derived rather than picked: each is sludge's own lightness and
# saturation rotated to a hue, and every bright is its base lightened by a
# fixed +22% - the "rim" step slopduel's art-direction brief defines,
# applied arithmetically so nothing drifts.
#
# Where the palette already has an answer it is used: red is the real
# error pink, green is sludge itself, black is the hairline.
set $color0 #2a2a38
set $color1 #ff3366
set $color2 #b5e853
set $color3 #e8dc53
set $color4 #539de8
set $color5 #e853e8
set $color6 #53e8e8
set $color7 #8a8a9e
set $color8 #5a5a78
set $color9 #ffa3ba
set $color10 #e0f5b6
set $color11 #f5f0b6
set $color12 #b6d5f5
set $color13 #f5b6f5
set $color14 #b6f5f5
set $color15 #e6e6e6

set $background-color $void
set $text-color $bone
set $accent-color $sludge

# Borders use the strong edge, never $edge. slopduel's own comment gives
# the reason and the numbers: edge-strong is 3.15:1 on panel and 3.39:1 on
# void, WCAG 1.4.11, while $edge is 1.37:1 against the void - a hairline
# that is decoration, not a boundary anyone can see. A focused window
# drawn in it would be indistinguishable from an unfocused one.
#
# The focused border is sludge, which is what that colour is reserved for:
# brand and positive marks, not generic green.

# target                 title        bg     text   indicator    border
client.focused           $sludge      $void  $bone  $sludge      $sludge
client.focused_inactive  $edge-strong $void  $bone  $edge-strong $edge-strong
client.unfocused         $edge-strong $void  $muted $edge-strong $edge-strong
client.urgent            $error-pink  $void  $bone  $error-pink  $error-pink
client.placeholder       $edge-strong $void  $bone  $edge-strong $edge-strong
client.background        $void
