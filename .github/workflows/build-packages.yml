name: build-packages

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - branding/**
      - installer/**
      - scripts/**
      - .github/scripts/**
      - .github/workflows/build-packages.yml
      # the reusable workflow this one calls does the actual building, so a
      # change there changes every build and must trigger one
      - .github/workflows/build-wave.yml
  workflow_dispatch:
    inputs:
      package:
        description: build a single package directory rather than all of them
        required: false

concurrency:
  # both architecture legs read-modify-write the same bucket, and repo-add is
  # not atomic; two runs must never overlap
  group: build-packages
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      waves: ${{ steps.split.outputs.waves }}
      wave_count: ${{ steps.split.outputs.wave_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # package_version.py derives pkgver/pkgrel from how many commits
          # have touched a package directory; a shallow checkout reports 1
          # for everything, which would publish every authored package at
          # pkgrel=1 forever and strand every later update
          fetch-depth: 0
      - id: split
        env:
          ONLY: ${{ inputs.package }}
        run: python3 scripts/discover_packages.py >> "$GITHUB_OUTPUT"

  # A wave is build-then-publish, because the next wave resolves its
  # dependencies out of the published repository: ashlaros-installer cannot
  # be built until ashlaros-branding is installable. Two waves are two
  # pairs of jobs rather than a loop - Actions has no such loop, and the
  # alternative (a workflow that dispatches itself) hides the ordering.
  wave0:
    needs: discover
    # every package already published at its current version leaves nothing
    # to do, which is the normal outcome of a commit that touches only CI
    if: fromJSON(needs.discover.outputs.wave_count) > 0
    uses: ./.github/workflows/build-wave.yml
    with:
      any: ${{ toJSON(fromJSON(needs.discover.outputs.waves)[0].any) }}
      compiled: ${{ toJSON(fromJSON(needs.discover.outputs.waves)[0].compiled) }}
    secrets: inherit

  wave1:
    needs: [discover, wave0]
    if: fromJSON(needs.discover.outputs.wave_count) > 1
    uses: ./.github/workflows/build-wave.yml
    with:
      any: ${{ toJSON(fromJSON(needs.discover.outputs.waves)[1].any) }}
      compiled: ${{ toJSON(fromJSON(needs.discover.outputs.waves)[1].compiled) }}
    secrets: inherit

  verify:
    needs: [wave0, wave1]
    # a wave that failed still published whatever built, so the tree is
    # checked either way; skipped is not failed
    if: always() && needs.wave0.result != 'cancelled'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pacman -Sy --noconfirm --needed python python-boto3
      - name: both trees resolve
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ashlaros
        run: python3 scripts/check_repo.py

  # An ISO built before this run published carries the previous packages and
  # says nothing about it (#25). build-iso checks and fails when that happens,
  # but the check is a backstop: dispatching from here means the common case -
  # a push touching packages/ and iso/ together - is ordered rather than
  # racing, so the backstop never has to fire.
  #
  # `always()` for the same reason verify has it, and it is not optional:
  # wave1 is skipped whenever one wave covers everything, which is most
  # pushes, and a skipped job in the needs chain skips everything after it
  # unless the condition is always(). Without it this job had never once
  # run - every dispatch since it was written was silently skipped, and the
  # nightly schedule was the only thing still building an ISO.
  iso:
    needs: verify
    if: always() && needs.verify.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build an iso against the packages just published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-iso.yml --repo "${{ github.repository }}" --ref main

  # Same ordering problem as the iso job, and the same fix - including the
  # always(). screenshots' setup.sh installs ashlaros-settings from the
  # published repository, so a run started by the same push as this one
  # photographs the previous build: f013b8b fixed the help overlay and
  # published a picture of it still broken, green.
  screenshots:
    needs: verify
    if: always() && needs.verify.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: photograph the desktop the packages just published make
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run screenshots.yml --repo "${{ github.repository }}" --ref main
