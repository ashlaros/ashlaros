title    AshlarOS install medium (%ARCH%, UEFI)
sort-key 01
# linux-cachyos, so the names carry the -cachyos suffix mkinitcpio gave them
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
