# Themes the out-of-process xdg-desktop-portal-lxqt file dialog, NOT regular
# Qt apps -- those read qt5ct.conf and qt6ct.conf. The portal backend is Qt6
# and is launched with QT_QPA_PLATFORMTHEME=lxqt hardcoded into its D-Bus
# activation line, so this is the only way to style it. icon_theme follows
# the sway theme (enable-qt-theme.sh); unset, lxqt falls back to oxygen,
# which nothing installs.
[General]
icon_theme=Papirus-Dark

[Qt]
style=qt6ct-style
