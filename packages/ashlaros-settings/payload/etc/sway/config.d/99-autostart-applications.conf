# autostart background applications

# Must precede every unit below: they are user units and inherit the systemd
# manager's environment, not sway's. Its own exec so it is issued before the
# block rather than racing the entries inside one.
exec $import_environment

# sway-session.target, up for this sway and down when it exits, so every
# unit PartOf it stops with the session instead of outliving it. exec, not
# exec_always: a reload must not start a second watcher. The script does
# its own import before the start rather than relying on the line above
# having finished - see scripts/session.sh.
exec $start_session

# autostarts
exec {
    $initialize_way_displays
    $initialize_foot_server
    $initialize_mounting_daemon
    $initialize_poweralert_daemon
    $initialize_idlehack_daemon
    $initialize_workspace_icons
    $initialize_swayr_daemon
    $initialize_idle_daemon
    $initialize_media_idle_inhibit
    $initialize_flashfocus
    $initialize_polkit_agent
    $initialize_cliphist_store
    $initialize_cliphist_watch

    $initialize_xdg_dirs
    $initialize_dex
    # after the environment import above, so a migration that shells out to
    # a desktop tool sees the same environment the session does
    $run_migrations
}

# commands that "reload" something
exec_always {
    $initialize_waybar

    $apply_background
    $help_menu
    $initialize_clip_persist
    $initialize_mako
    $initialize_wlsunset
    $initialize_autotiling
    $auto_xdg_keyboard
    $initialize_watch_playerctl
    $initialize_scratchpad_urgent_watch
    $initialize_taildrop_receive
    $initialize_calendar_daemon
    $initialize_calendar_sync
    $onscreen_bar --refresh
    $disable_nm_applet_autostart
    $nm_applet
}
