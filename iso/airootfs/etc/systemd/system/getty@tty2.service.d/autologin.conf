# The live session's VT (#83). logind's NAutoVTs defaults to 6, so it
# spawns getty@tty2 the first time someone switches to it - no enabling
# needed, and nothing runs until the VT is actually used. Root's password
# is empty on the ISO, so the autologin needs no auth change either.
#
# What runs is root/.live_session.sh via .zlogin, which guards on tty2 the
# way .automated_script.sh guards on tty1.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --autologin root - ${TERM}
