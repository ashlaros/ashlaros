#!/hint/bash
# What CachyOS's own v3 build container sets and CachyOS's /etc/makepkg.conf
# does not (CachyOS/docker-makepkg, docker-makepkg-v3, 9b0259d) - the rest
# of that container's flags are already here, from CachyOS's pacman package.
#
# The C and Rust target stays -march=native / target-cpu=native: a local
# build runs on the machine that compiled it, and native is x86-64-v3 or
# better on every CPU AshlarOS installs on. Overriding it with v3 would
# only lose the rest.
#
# zz- so this is sourced after rust.conf, whose RUSTFLAGS it extends.
# Override any of it in ~/.makepkg.conf, which makepkg reads last.

if [[ $CARCH == x86_64 ]]; then
	# Go has no "native": without this, go builds for baseline x86-64.
	# v3 because the installer requires a v3 CPU, so it always runs.
	export GOAMD64=v3

	# the same packed relocations LDFLAGS already asks C builds for
	RUSTFLAGS+=" -Clink-arg=-z -Clink-arg=pack-relative-relocs"
fi
