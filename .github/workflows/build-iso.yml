name: build-iso

on:
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [main]
    paths:
      - iso/**
      - .github/workflows/build-iso.yml
      # the harness is now what decides whether an ISO publishes, so a
      # change to it has to be exercised rather than trusted until the
      # next time someone touches iso/
      - test/vm/**
      # the build runs these: one stages the package cache into the
      # profile, the other can fail the build. A change to either that
      # nothing here exercised would surface as a broken nightly.
      - scripts/seed_install_cache.py
      - scripts/check_iso_packages.py
      - scripts/check_iso_osinfo.py
      # the entry the check matches the medium against
      - packages/ashlaros-osinfo/**
  workflow_dispatch:

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # mkarchiso mounts, makes device nodes, and runs mkinitcpio in a
      # chroot; none of that works under the default profile
      options: --privileged
    steps:
      - name: install git before the checkout
        # actions/checkout falls back to a REST tarball when git is missing -
        # "The repository will be downloaded using the GitHub REST API" - and
        # a tarball has no .git at all, so fetch-depth is ignored and
        # check_iso_packages.py cannot derive a version from history
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check_iso_packages.py derives each authored package's version from
          # its commit history; a shallow clone makes every one of them
          # <date>-1 and the staleness check meaningless
          fetch-depth: 0
      - name: install archiso
        run: |
          pacman -S --noconfirm --needed archiso
          pacman-key --init
          pacman-key --populate archlinux
      - name: trust the repositories the profile pulls from
        # mkarchiso syncs with the profile's own pacman.conf, which names
        # cachyos and ashlaros; a key it does not have is a build that stops
        # before it downloads anything
        env:
          ASHLAROS_KEY_URL: https://ashlaros.download/packages/ashlaros.gpg
        run: .github/scripts/trust-repo-keys.sh
      - id: version
        run: echo "value=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      - name: stage the installer's packages into the profile
        # Before mkarchiso, not after: it copies profile/airootfs into the
        # pacstrap dir at _make_custom_airootfs, long before it packs the
        # squashfs, so a cache staged here is simply carried along. Staging
        # it afterwards would mean repacking an image that is already built.
        #
        # _cleanup_pacstrap_dir empties /var/cache/pacman/pkg and nothing
        # else under /var/cache, which is why ISO_PACKAGE_CACHES names a
        # path of ours rather than pacman's.
        run: python3 scripts/seed_install_cache.py --rootfs iso/airootfs
      - name: build the iso
        # Retried, because one slow mirror throws away the whole build.
        # mkarchiso's pacstrap has no retry of its own, and CachyOS has
        # stalled mid-download twice today with "Operation too slow" -
        # once here, killing ten minutes of work for a transient.
        #
        # The same -w each time: _run_once stamps each stage in the work
        # directory, so a second invocation skips what already completed
        # and re-attempts only the part that failed.
        run: |
          for attempt in 1 2 3; do
            if mkarchiso -v -w /tmp/work -o out iso/; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "## mkarchiso failed three times; not a transient" >&2
              exit 1
            fi
            echo "## mkarchiso failed (attempt $attempt); retrying"
            sleep 30
          done
          ls -la out/
      - name: the iso carries this commit's packages
        # build-packages publishes to the same repository this pacstrap just
        # read from, and the two workflows do not wait for each other. Without
        # this the ISO is silently one commit behind and only an unsquashfs
        # would show it - see issue #25.
        run: python3 scripts/check_iso_packages.py --rootfs /tmp/work/x86_64/airootfs
      - name: virtualisation tools still recognise the iso
        # The osinfo entry matches on strings in the volume descriptor, so
        # renaming the label un-detects us - and Boxes hides its firmware
        # selector for an unknown OS, leaving a BIOS VM this ISO cannot
        # boot (#85). Nothing else would notice until someone opened it.
        run: python3 scripts/check_iso_osinfo.py --iso out/*.iso
      - name: checksum
        working-directory: out
        run: sha256sum ./*.iso > SHA256SUMS
      - name: hand the iso to the tests
        # The build runs in a privileged arch container; the VM harness
        # runs docker itself. Nesting one in the other buys nothing, so the
        # ISO travels as an artefact and the tests are ordinary jobs.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso
          path: out/*.iso
          # The ISO is a squashfs of already-zstd-compressed packages, so
          # deflating it buys nothing: measured, level 6 turned 1,978,718,208
          # bytes into 1,967,600,780 - 0.56% - and every one of the three
          # consumer jobs pays to inflate it again. The action's own docs
          # recommend 0 for large files that do not compress.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test-boot:
    # The ISO reaching the installer's first screen exercises systemd-boot
    # finding the loader entry, the squashfs mounting, and the orchestrator
    # importing - none of which mkarchiso can tell you about. Minutes, not
    # the hour the install test takes, so it fails fast on the common
    # breakage.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso
          path: iso-artifact
      - name: the iso reaches the installer
        run: test/vm/ci.sh boot "$(ls iso-artifact/*.iso | head -n1)"
      - name: keep what the screen showed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-screenshots
          path: |
            /tmp/ashlaros-vm-boot/out/*.png
            /tmp/ashlaros-vm-boot/out/serial.log
          # error, not ignore: this is the evidence a failure is diagnosed
          # from, and a silent "no files found" is how it went missing
          if-no-files-found: error

  test-install:
    # Installing and then booting what was installed. The second half is
    # the point: an installer that finishes and leaves an unbootable disk
    # reports success, and only a boot disproves it.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso
          path: iso-artifact
      - name: installing it produces a system that boots
        run: test/vm/ci.sh install "$(ls iso-artifact/*.iso | head -n1)"
      - name: keep what the screen showed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-screenshots
          path: |
            /tmp/ashlaros-vm-install/out/*.png
            /tmp/ashlaros-vm-install/out/serial.log
            # the driver's own log: when the install stalls rather than
            # fails, the serial console shows the boot it already got past
            # and only this says what the driver was waiting for
            /tmp/ashlaros-vm-install/out/install.log
          if-no-files-found: error

  publish:
    # Nothing is published until something has booted it. Before this, the
    # ISO went to R2 and a release was cut on the strength of mkarchiso
    # exiting zero - which says the image was assembled, not that it works.
    needs: [build, test-boot, test-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso
          path: out
      # The installer's picture for the landing page. Taken by test-boot,
      # so it shows this ISO and no other; uploaded here, so a picture of an
      # installer that then failed its install never reaches the page.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boot-screenshots
          path: boot-shots
      - name: checksum
        # Recomputed here rather than carried: the artefact round trip is
        # what the checksum is meant to prove the image survived.
        working-directory: out
        run: sha256sum ./*.iso > SHA256SUMS
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: upload to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ashlaros-iso
        # The version is read out of the image names, not computed here.
        # profiledef.sh stamps the filename when the ISO is built and this
        # job runs after about an hour of VM tests: a date taken here
        # published 2026.09.17/ashlaros-2026.09.16-x86_64.iso across
        # midnight UTC, and the worker builds the latest/ redirect target
        # from the prefix, so it pointed at a key that does not exist.
        id: upload
        run: |
          mise run install
          python3 scripts/upload_iso.py --iso-dir out
          mkdir -p shots
          cp boot-shots/ci-installer.png shots/installer.png
          python3 scripts/upload_screenshots.py --shot-dir shots
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upload.outputs.version }}
        run: |
          # the ISO itself is not attached: github caps a release asset at
          # 2 GB and this one is larger. The bucket holds the image; the
          # release holds the checksum that proves which image it is.
          # The version is a date, so a second build on the same day finds
          # its tag already there. That is a rebuild of the same version,
          # not an error: replace the checksum and move the tag to the
          # commit that produced it.
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v$VERSION" out/SHA256SUMS \
              --repo "${{ github.repository }}" --clobber
            # The tag moves by git, not by `gh release edit --target`.
            # Retargeting an existing release moves the underlying ref,
            # and GITHUB_TOKEN is refused there - "Resource not accessible
            # by integration" - however much `contents: write` the job
            # has. Retargeting to the *same* commit is a no-op and
            # succeeds, which is why this only ever failed on a rebuild.
            git config --global --add safe.directory "$PWD"
            git tag -f "v$VERSION" "$GITHUB_SHA"
            git push -f origin "refs/tags/v$VERSION"
            gh release edit "v$VERSION" --repo "${{ github.repository }}" \
              --notes "https://ashlaros.download/iso/$VERSION/"
            echo "## replaced the assets on the existing v$VERSION"
          else
            gh release create "v$VERSION" out/SHA256SUMS \
              --repo "${{ github.repository }}" \
              --title "AshlarOS $VERSION" \
              --notes "https://ashlaros.download/iso/$VERSION/"
          fi
