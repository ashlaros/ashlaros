# wob as upstream ships it: wob.socket holds the FIFO at $XDG_RUNTIME_DIR/wob.sock
# and starts this on the first value written, so wob.sh only writes. It
# used to start `tail -f pipe | wob` itself, from sway's exec, into the
# login scope - which logind leaves running on logout, one pair more for
# every login.
[Unit]
PartOf=sway-session.target
After=sway-session.target

[Service]
# the theme's colours and the user's overrides, which wob.sh merges into
# one file; wob reads a single config
ExecStart=
ExecStart=/usr/bin/wob -c %h/.cache/wob.ini
