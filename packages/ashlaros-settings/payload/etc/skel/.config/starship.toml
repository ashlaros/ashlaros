# Auto-generated by generate-starship-config.sh - changes will be
# overwritten on theme switch.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[  ](fg:mark_ink bg:mark)\
$username\
[](bg:dir fg:mark)\
$directory\
[](bg:git fg:dir)\
$git_branch\
$git_status\
[](fg:git bg:lang)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:lang bg:env)\
$conda\
[](fg:env bg:time)\
$time\
[ ](fg:time)\
$cmd_duration"""

palette = 'ashlaros'


[username]
show_always = true
style_user = "bg:mark fg:mark_ink"
style_root = "bg:mark fg:mark_ink"
format = '[ $user]($style)'

[directory]
style = "bg:dir fg:dir_ink"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:git"
format = '[[ $symbol $branch ](fg:git_ink bg:git)]($style)'

[git_status]
style = "bg:git"
format = '[[($all_status$ahead_behind )](fg:git_ink bg:git)]($style)'

[nodejs]
symbol = ""
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[bun]
symbol = ""
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[c]
symbol = " "
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[rust]
symbol = ""
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[golang]
symbol = ""
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[php]
symbol = ""
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[java]
symbol = " "
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[kotlin]
symbol = ""
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[haskell]
symbol = ""
style = "bg:lang"
format = '[[ $symbol( $version) ](fg:lang_ink bg:lang)]($style)'

[python]
symbol = ""
style = "bg:lang"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:lang_ink bg:lang)]($style)'

[docker_context]
symbol = ""
style = "bg:env"
format = '[[ $symbol( $context) ](fg:env_ink bg:env)]($style)'

[conda]
symbol = "  "
style = "fg:env_ink bg:env"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:time"
format = '[[  $time ](fg:time_ink bg:time)]($style)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:time"
disabled = false
show_notifications = true
min_time_to_notify = 45000


[palettes.ashlaros]
mark = "#8a8f98"
mark_ink = "#141a1b"
dir = "#5e6263"
dir_ink = "#eeeeee"
git = "#4b4f50"
git_ink = "#eeeeee"
lang = "#393e3f"
lang_ink = "#eeeeee"
env = "#393e3f"
env_ink = "#eeeeee"
time = "#282d2e"
time_ink = "#eeeeee"
