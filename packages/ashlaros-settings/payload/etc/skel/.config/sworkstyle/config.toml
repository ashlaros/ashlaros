#
# pattern: Can either be the exact "app_name" (app_id/class) of the window or a regex string in the format of `"/{regex}/"` which will match the window "title".
# icon: Your beatiful icon
#
# verbose format:
#
# '{pattern}' = { type = 'generic' | 'exact', value = '{icon}' }
#
#
# If it couldn't match something it will print:
#
# WARN [sworkstyle:config] No match for '{app_name}' with title '{title}'
#
# You can use {title} to do a generic matching
# You can use {app_name} to do an exact match
# You can find icons for nerd fonts here: https://www.nerdfonts.com/cheat-sheet
# Anything added in here will override the defaults in the package.
#
# sworkstyle compiles a default table in (default_config.toml upstream),
# and it already covers firefox, foot, the terminals and the usual GUI
# applications - so this file is for what it does not know rather than a
# second copy of what it does. The entries below are the applications
# AshlarOS ships that upstream has no icon for, and common ones it misses;
# without them the daemon logs "No match" and the workspace shows the
# generic fallback.
#
# Icons in order of preference: nf-dev (dev-terminal, dev-slack,
# dev-vscode), then nf-fae (fae-telegram), then nf-fa or nf-md only where
# Nerd Fonts has neither for the application.

[matching]
# The file manager the installer puts on every desktop.
'pcmanfm-qt' = ''
# The terminal. Upstream knows 'foot', but every terminal here is a client
# of foot-server and reports app_id "footclient", which upstream does not -
# so the one application on every workspace showed the fallback.
'footclient' = ''
# A standalone foot - "Foot" in the launcher, or any terminal started while
# foot-server is down - reports "foot", which upstream maps to nf-fa. The
# same terminal, so the same icon.
'foot' = ''
# The browser the installer puts on every desktop (zen-browser-bin, app_id
# "zen"). Upstream knows firefox but not zen; nf-md-web rather than the
# firefox icon, because Zen is not Firefox-branded.
'zen' = '󰖟'
# The settings TUI and the installer's own dashboard both run in foot with
# a set app-id; matched by title so they read as themselves rather than as
# a terminal.
'/(?i)ashlaros.settings/' = ''
'floating_shell' = ''
# Telegram Desktop (extra/telegram-desktop) is not shipped, but upstream's
# table has no entry for it under any name. Wayland app_id, not the old
# X11 class TelegramDesktop.
'org.telegram.desktop' = ''
# Signal Desktop runs natively on Wayland here and reports app_id "signal".
# Upstream matches only the X11 class 'Signal', and matching is exact, so
# this is the same icon under the name Wayland uses.
'signal' = ''
# Slack on Wayland reports app_id "slack". Upstream matches only the X11
# class 'Slack', and matching is exact.
'slack' = ''
# Microsoft's VS Code build (visual-studio-code-bin) reports app_id
# "com.microsoft.VSCode" on Wayland, its desktop file's StartupWMClass.
# Upstream knows only 'Code' and 'code-oss', and matching is exact.
'com.microsoft.VSCode' = ''
# A foot window running tmux, zellij or herdr. None of them names itself in
# the terminal title, so skel's .zshrc sets this app_id through foot's
# OSC 176 while one runs and resets it at the next prompt. dev-tmux (U+E94C).
'terminal-multiplexer' = ''
