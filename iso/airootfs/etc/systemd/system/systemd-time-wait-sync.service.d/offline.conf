# Do not wait for a clock that will never sync.
#
# Upstream ships TimeoutStartSec=infinity. On an install medium with a
# network that is fine - timesyncd answers in seconds. With no network it
# is a boot that never finishes: nothing ever syncs the clock, so
# time-sync.target never arrives, pacman-init.service is ordered after it
# and stays inactive, and .automated_script.sh waited on that start
# forever. Measured on a NET=no run: the ISO sat on the login banner with
# the installer never drawn, which reads as a hung image rather than as a
# missing network.
#
# A drop-in rather than an edit: the unit in sysinit.target.wants is a
# symlink to /usr/lib/systemd/system, which is the package's file and not
# ours to rewrite.
#
# 30s, then the boot carries on with whatever clock it has. An unsynced
# clock is worth noticing and not worth refusing to install over: the RTC
# is normally close enough for signature validity, the ISO now carries
# every package an install needs, and the installed system runs timesyncd
# itself the first time it sees a network.
[Service]
TimeoutStartSec=30s
