# The host for ashlaros-speakers.service: a bare PipeWire client that
# loads each speaker's calibration from
#   ~/.config/pipewire/ashlaros-speakers.conf.d/
# which ashlaros-speakers writes, one file per speaker.
#
# filter-chain.conf's module list, with one change: module-rt asks RTKit
# directly, as pipewire.conf does, rather than through the portal. A
# portal started before RTKit reports its limits as zero, and a data
# thread that is made realtime with no budget is SIGKILLed by the kernel
# the moment audio flows (omarchy-speaker-calibrator#25).
context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level       = -11
            rtportal.enabled = false
        }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
]
