# Where each PKGBUILD in this directory comes from.
#
# ashlaros-*: authored here, no upstream. Everything else is vendored - the
# AUR is not a build input, because an AUR PKGBUILD can be force-pushed
# between two builds of the same version.
#
# Vendored copies do not update themselves. track-upstreams.yml runs
# scripts/track_upstreams.py daily: it fetches each upstream PKGBUILD -
# from the AUR through cgit, from github through the contents API -
# compares it against the pristine copy in packages/.upstream/, and opens
# one pull request per package that moved.
#
# Requires the ashlaros org to allow GitHub Actions to create pull
# requests (Actions > General > Workflow permissions). Without it the
# workflow fails with an explicit message rather than silently doing
# nothing - the branch is still pushed, so the update is not lost. Five of these carry deliberate local edits
# (arch= widened to aarch64, wluma's man-page step removed), so the merge
# is three-way against that base - an upstream change to a line we never
# touched applies cleanly, one to a line we did touch is reported as a
# conflict and left for a human. Nothing is ever merged automatically.
#
# A vendored package is also rebuilt when the distribution moves a soname it
# linked against, which no upstream change announces: rebuild-on-breakage.yml
# audits the published artefacts weekly and bumps pkgrel decimally (6 -> 6.1)
# on what no longer resolves. That leaves the integer part to upstream, so the
# next release here still wins.
#
# arch: what the PKGBUILD declares after our edits. `both` means the
# aarch64 leg builds it too; a package that fails to compile there is
# dropped from the aarch64 database with a warning rather than failing the
# run - ALARM users lose that package, not the repository.

packages:
  # authored here
  ashlaros-branding:
    arch: any
  ashlaros-browser-settings:
    arch: any
  ashlaros-installer:
    arch: any
  ashlaros-keyring:
    arch: any
  ashlaros-mirrorlist:
    arch: any
  ashlaros-snapshot:
    arch: any
  ashlaros-release:
    arch: any
  ashlaros-settings:
    arch: any

  # vendored from the AUR
  bluetuith:
    upstream: https://aur.archlinux.org/bluetuith.git
    arch: both
  # The four GTK themes and the Kvantum one the catppuccin sway themes
  # name. Vendored because they were AUR-only: on ARM, where yay has no
  # build, picking a catppuccin theme could apply the sway colours and
  # nothing else (#56). All are arch=any - prebuilt zips and theme files -
  # so carrying them costs a rebuild, not a port.
  catppuccin-gtk-theme-frappe:
    upstream: https://aur.archlinux.org/catppuccin-gtk-theme-frappe.git
    arch: any
  catppuccin-gtk-theme-latte:
    upstream: https://aur.archlinux.org/catppuccin-gtk-theme-latte.git
    arch: any
  catppuccin-gtk-theme-macchiato:
    upstream: https://aur.archlinux.org/catppuccin-gtk-theme-macchiato.git
    arch: any
  catppuccin-gtk-theme-mocha:
    upstream: https://aur.archlinux.org/catppuccin-gtk-theme-mocha.git
    arch: any
  flashfocus:
    upstream: https://aur.archlinux.org/flashfocus.git
    arch: any
  howdy-next:
    upstream: https://aur.archlinux.org/howdy-next.git
    # x86_64 only, and not by choice: libinih is not in Arch Linux ARM, so
    # the aarch64 leg has nothing to build against. build-wave.yml reads
    # the PKGBUILD's own arch= line and skips that leg rather than
    # producing a tolerated-failure warning for a package that was never
    # meant to build there (61ad8b6).
    #
    # Never a hard dependency: pacman resolves 182 packages for it, of
    # which opencv is 112.81 MiB and qt6-base 66.53 MiB - measured, not
    # estimated - for hardware most machines do not have.
    arch: x86_64
  ddcci-driver-linux-dkms:
    upstream: https://aur.archlinux.org/ddcci-driver-linux-dkms.git
    # The 35-vote release package, not the 3-vote -git one, which carries
    # an epoch that force-wins and pins no revision at all - two builds of
    # the same pkgver can be different code, which for a kernel module is
    # the wrong trade.
    #
    # Ours diverges from that base in one way worth knowing at merge time:
    # upstream pins the v0.4.5 tag, and that tag does not build on any
    # kernel we ship. The eight commits after it are each a kernel-API fix
    # (6.8, 6.10, 6.11, CONFIG_FB_DEVICE), so ours pins a master commit and
    # carries two unmerged merge requests as patches. An upstream change
    # that moves to a newer tag is the one worth taking here.
    #
    # x86_64 only for now: the module is more valuable on the Pi, which has
    # no /sys/class/backlight at all, but the ARM image ships no DKMS
    # toolchain and the module is untested on that kernel (#65).
    arch: x86_64
  kvantum-theme-catppuccin:
    upstream: https://aur.archlinux.org/kvantum-theme-catppuccin-git.git
    # rewritten rather than copied: upstream's is a -git package whose
    # pkgver() counts commits on live HEAD, so every rebuild published a
    # byte-different object under the same version. Ours pins a commit,
    # the way gtk-nocsd pins a tag and for the same reason - so the
    # three-way merge base here is the AUR file this was derived from.
    arch: any
  mise-bin:
    upstream: https://aur.archlinux.org/mise-bin.git
    # Arch ships `mise` in extra for x86_64 only, and Arch Linux ARM has
    # neither mise nor mise-bin - so an ARM user of this repository gets
    # no mise at all unless we carry it. Upstream publishes a linux-arm64
    # build and this PKGBUILD already selects per arch, so vendoring is
    # the whole fix rather than a patch.
    arch: both
  nwg-wrapper:
    upstream: https://aur.archlinux.org/nwg-wrapper.git
    # pure python; the AUR's x86_64 is an oversight, widened here
    arch: both
  phinger-cursors:
    upstream: https://aur.archlinux.org/phinger-cursors.git
    arch: any
  poweralertd:
    upstream: https://aur.archlinux.org/poweralertd.git
    arch: both
  python-xpybutil:
    upstream: https://aur.archlinux.org/python-xpybutil.git
    arch: any
  swaycwd:
    # no upstream repository: the AUR url is a dead google cache link, so
    # the script itself is vendored beside the PKGBUILD
    arch: any
  swaylock-effects:
    upstream: https://aur.archlinux.org/swaylock-effects.git
    arch: both
  swayr:
    upstream: https://aur.archlinux.org/swayr.git
    arch: both
  sworkstyle:
    upstream: https://aur.archlinux.org/sworkstyle.git
    arch: both
  topgrade:
    upstream: https://aur.archlinux.org/topgrade.git
    arch: both
  way-displays:
    upstream: https://aur.archlinux.org/way-displays.git
    arch: both
  wluma:
    upstream: https://aur.archlinux.org/wluma.git
    arch: both
  xdg-terminal-exec:
    upstream: https://aur.archlinux.org/xdg-terminal-exec.git
    arch: any

  # vendored from manjaro-contrib, which maintains these outside the AUR
  zen-browser-bin:
    # upstream releases often - expect this to be one of the noisier
    # tracker entries, one PR per Zen release
    upstream: https://aur.archlinux.org/zen-browser-bin.git
    arch: both
  grimshot:
    upstream: https://github.com/manjaro-contrib/grimshot
    arch: any
  idlehack:
    upstream: https://github.com/manjaro-contrib/idlehack
    arch: both
  sway-services:
    upstream: https://github.com/manjaro-contrib/sway-services
    arch: any
