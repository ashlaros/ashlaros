# The virtual camera ashlaros-reactions writes to. ashlaros-reactions finds
# it by this label, not by number: /dev/videoN is whatever was free.
#
# exclusive_caps=1 is what makes browsers list it at all - Chrome and
# Firefox skip a node that claims to be an output too - and it has the
# side effect wanted here: until ashlaros-reactions has written a frame,
# the device is an output only, so with the service off no application
# offers an empty camera.
#
# video_nr is left alone: OBS's virtual camera loads this same module and
# looks for a free loopback device; one we pinned to a number would only
# collide with whatever else wanted it.
options v4l2loopback devices=1 exclusive_caps=1 card_label="AshlarOS Camera"
