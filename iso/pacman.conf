#
# The pacman configuration mkarchiso builds the live root with.
#
# Two things must both be true or the build fails:
#
#  1. Architecture lists x86_64_v3. Without it mkarchiso aborts on the first
#     v3 package with "package sway-1:1.12-4.1-x86_64_v3 does not have a
#     valid architecture".
#  2. The v3 repositories precede core and extra. pacman resolves a package
#     from the FIRST repository that carries it, not the highest version, so
#     the order below is what makes the system v3-optimised rather than a
#     plain x86_64 one that merely has the v3 repos configured.
#
# Resolution with this order: coreutils→cachyos-core-v3,
# ffmpeg/sway→cachyos-extra-v3, mesa/chwd/linux-cachyos→cachyos,
# glibc/systemd/bash/firefox→core/extra, which have no v3 build and fall
# through cleanly.
#

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3

CheckSpace
ParallelDownloads = 8

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos-core-v3]
Server = https://mirror.cachyos.org/repo/x86_64_v3/$repo

[cachyos-extra-v3]
Server = https://mirror.cachyos.org/repo/x86_64_v3/$repo

[cachyos]
Server = https://mirror.cachyos.org/repo/x86_64/$repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Server=, not an Include: this file configures the BUILD host, where
# /etc/pacman.d/ashlaros-mirrorlist does not exist - the package that ships
# it is one of the packages being fetched from here. The installed system
# gets the Include, written by the orchestrator.
[ashlaros]
Server = https://packages.ashlaros.download/$arch
