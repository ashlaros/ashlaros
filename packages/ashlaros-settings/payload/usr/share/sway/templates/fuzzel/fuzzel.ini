# The desktop's defaults for fuzzel, which every menu uses - the launcher,
# the clipboard, the window switcher, the pickers. ~/.config/fuzzel/fuzzel.ini
# includes this after the theme's colors.ini, so anything set there wins.

[main]
# the terminal for Terminal=true desktop entries; {cmd} is fuzzel's
# placeholder, and footclient is the desktop's $term
terminal=footclient {cmd}
# commands from $PATH in the same list as the applications, which is what
# rofi's -show combi -combi-modes "drun,run" gave the launcher
list-executables-in-path=yes
# above every window, fullscreen ones included, the way rofi drew
layer=overlay
lines=10
width=45
horizontal-pad=20
vertical-pad=10
inner-pad=6
image-size-ratio=0

[border]
width=2
radius=6
