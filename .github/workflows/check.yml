name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: test
        working-directory: worker
        run: npm test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        # the installer is the one place a shell bug destroys a disk, so it
        # is checked rather than trusted
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning \
            installer/configurator \
            installer/dashboard \
            installer/ashlaros-install \
            .github/scripts/*.sh \
            test/vm/*.sh \
            iso/airootfs/root/.automated_script.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: ruff
        run: |
          pip install ruff
          ruff check scripts installer/orchestrator test/vm

  arm-repo:
    # The aarch64 half of the repository has no other test: the ISO is
    # x86_64 only, so nothing else ever installs an ashlaros package on ARM.
    # A native ARM runner is the only place this can run - qemu-user under
    # rootless docker cannot register binfmt.
    runs-on: ubuntu-24.04-arm
    container: menci/archlinuxarm:base
    steps:
      - name: an ARM machine can install from the repository
        run: |
          # pacman 7 confines downloads with Landlock; this container's
          # seccomp profile blocks the syscalls, failing every sync with
          # "the Landlock ruleset could not be applied". Same probe the
          # build containers use - keep the isolation where it works.
          if ! pacman -Sy --noconfirm >/dev/null 2>&1; then
            sed -i '0,/^\[options\]/s//[options]\nDisableSandbox/' /etc/pacman.conf
          fi
          pacman -Sy --noconfirm --needed curl >/dev/null
          curl -fsSL "${REPO_URL}/ashlaros.gpg" -o /tmp/ashlaros.gpg
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman-key --add /tmp/ashlaros.gpg
          gpg --show-keys --with-colons /tmp/ashlaros.gpg |
            awk -F: '/^fpr:/ {print $10}' |
            while read -r fingerprint; do pacman-key --lsign-key "$fingerprint"; done
          printf '\n[ashlaros]\nSigLevel = Required DatabaseOptional\nServer = %s/$arch\n' \
            "$REPO_URL" >> /etc/pacman.conf
          pacman -Sy

          # against Arch Linux ARM's own core/extra, which is what an ARM
          # user actually runs underneath this repository
          pacman -S --noconfirm ashlaros-settings
          pacman -Q ashlaros-settings ashlaros-branding
          test -f /etc/sway/config
    env:
      REPO_URL: ${{ vars.REPO_URL || 'https://packages.ashlaros.download' }}

  packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every PKGBUILD parses and its checksums match its sources
        # a stale sha256sum fails the build twenty minutes in; catch it here
        run: |
          # git: several PKGBUILDs take git+ sources, which makepkg
          # refuses to even look at without it
          pacman -Sy --noconfirm --needed pacman-contrib git >/dev/null
          useradd -m builder
          chown -R builder:builder .
          fail=0
          for pkgbuild in packages/*/PKGBUILD; do
            dir=$(dirname "$pkgbuild")
            if ! sudo -u builder bash -c "cd '$dir' && makepkg --verifysource --noconfirm --skippgpcheck" >/dev/null 2>&1; then
              echo "::error file=$pkgbuild::sources do not verify"
              fail=1
            fi
          done
          exit $fail
