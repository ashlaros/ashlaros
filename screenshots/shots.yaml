# What to photograph, one entry per picture.
#
# A manifest rather than a script that grows an `if` per shot: adding a
# picture is a block here, and the ordering is data instead of control flow.
#
# `commands` run in order, each detached; `settle` is the one unavoidable
# wait - a compositor has no "everything has drawn" signal, and grim will
# happily capture a half-painted surface. Keep it as small as the slowest
# app in the shot allows.
#
# `layout` is swaymsg run after the windows exist, so placement is stated
# rather than hoped for.

- name: desktop
  description: the default session - waybar, wallpaper, a terminal
  commands:
    - footclient
  settle: 3
  layout:
    # floating, because a tiled window fills the output and the wallpaper -
    # half of what this picture is for - would be entirely behind it
    - '[app_id="foot"] floating enable'
    - '[app_id="foot"] resize set 1100 620'
    - '[app_id="foot"] move position center'

- name: tiling
  description: three terminals tiled, which is what the window manager is for
  commands:
    # Something on screen in each: three empty prompts show the layout but
    # not that anything runs in them. All shipped by the settings package -
    # there is no fastfetch or neofetch in the dependency set.
    #
    # Deliberately not btop, which is otherwise the obvious choice: it
    # renders the build machine's CPU model, real memory, and a process
    # list naming the capture script and docker. A published picture should
    # not contain the host that made it.
    - footclient khal interactive
    # the split runs between launches: sway applies it to what is focused,
    # so stacking all three first and arranging afterwards cannot work.
    # This puts the second beside the first and the third below it, which
    # shows both split directions in one picture.
    - swaymsg splitv
    # not bluetuith: it exits immediately with no bluetooth adapter, and a
    # pane that closes leaves a two-window shot pretending to be three
    - footclient sh -c 'pacman -Q | tail -20; exec zsh'
    - swaymsg splith
    - footclient sh -c 'pacman -Q | wc -l | xargs printf "%s packages\n"; sway --version; exec zsh'
  settle: 8

- name: settings
  description: the settings TUI, which is what the distribution adds over Arch
  commands:
    # footclient takes the command to run, so the terminal opens on the
    # menu rather than on a prompt someone has to be told to type into.
    # The menu draws itself and waits for a choice, so there is no input to
    # send and nothing to time.
    - footclient ashlaros-settings-tui
  # gum's first paint is one frame after foot maps the window, and grim
  # will photograph the empty terminal in between
  settle: 5
  layout:
    # floating and centred, the same as `desktop`: tiled it would cover the
    # wallpaper and waybar, and the point of this picture is the tool in
    # its place rather than the tool alone.
    #
    # Tall enough for the whole menu, which is the point of the picture.
    # This was 320 when the menu was seven rows; it grew into groups, gum
    # scrolls a list longer than its window, and the published shot began
    # halfway down at "Location" with no sign there was anything above it.
    # 600 holds every row a fully equipped machine shows - 36, measured in
    # a headless session - and the container here shows fewer, so there is
    # room below rather than a list cut short.
    - '[app_id="foot"] floating enable'
    - '[app_id="foot"] resize set 720 600'
    - '[app_id="foot"] move position center'

# The launcher is detached so the capture happens with it on screen, and
# it draws a layer surface - which the per-shot `[app_id=".*"] kill` does
# not match. Left running it sat over the help overlay two shots later.
- name: launcher
  description: the launcher over the desktop
  commands:
    - footclient
  settle: 3
  # The desktop's own $menu, bare: fuzzel reads the theme's colours and the
  # launcher's settings from ~/.config/fuzzel, so this is the menu Super+d
  # opens, not a picture of one configured for the shot. It grabs the
  # keyboard and never returns, so it runs detached.
  overlay: fuzzel
  overlay_settle: 2

# One picture per matcha variant. The four differ only in the GTK theme and
# the accent, which is exactly the kind of change that resolves cleanly and
# still looks wrong - so #84 asked for pictures rather than a package list.
  after:
    - pkill -x fuzzel

- name: theme-matcha-green
  gallery: false
  description: the default theme, which the shipped sway config names
  theme: matcha-green
  commands:
    - footclient
  settle: 3
  layout:
    - '[app_id="foot"] floating enable'
    - '[app_id="foot"] resize set 1100 620'
    - '[app_id="foot"] move position center'
- name: theme-matcha-blue
  gallery: false
  description: the azul variant
  theme: matcha-blue
  commands:
    - footclient
  settle: 3
  layout:
    - '[app_id="foot"] floating enable'
    - '[app_id="foot"] resize set 1100 620'
    - '[app_id="foot"] move position center'
- name: theme-matcha-leaf
  gallery: false
  description: the pueril variant
  theme: matcha-leaf
  commands:
    - footclient
  settle: 3
  layout:
    - '[app_id="foot"] floating enable'
    - '[app_id="foot"] resize set 1100 620'
    - '[app_id="foot"] move position center'
- name: theme-matcha-red
  gallery: false
  description: the aliz variant, the one with its own accent
  theme: matcha-red
  commands:
    - footclient
  settle: 3
  layout:
    - '[app_id="foot"] floating enable'
    - '[app_id="foot"] resize set 1100 620'
    - '[app_id="foot"] move position center'

# The keybinding overlay, which session.sh deliberately switches off for
# every other shot - it covers half the screen, so a picture of anything
# else becomes a picture of this instead. Photographed here because
# nothing else renders it: eww needs a GTK display, so a container without
# one cannot show whether the window has a usable size, and it shipped
# ellipsized to a column of "…" for want of a :width.
- name: help-overlay
  # eww draws it as a layer surface, not an app_id window
  layer: true
  description: every keybinding on screen at once, which Super+? brings back
  #
  # Last in the file on purpose, and it puts the lockfile back. The
  # per-shot cleanup kills app_id windows, and eww's overlay is a layer
  # surface, so it is not one - left open it would sit over every shot
  # taken after this one.
  commands:
    - rm -f $HOME/.local/help_disabled
    - /usr/share/sway/scripts/help.sh
  settle: 6
  # Taking the picture is not checking it. f013b8b shipped an overlay that
  # broke every line at each n and r - "window" as "wi/dow" - and this shot
  # photographed exactly that, twice, while the job stayed green: a picture
  # nobody looks at asserts nothing.
  #
  # So assert on what eww holds. `eww get help-sheet` is the parsed sheet the
  # window renders from, after eww has run the poll command - so a mangled
  # command fails here as surely as a mangled config would. Every entry
  # needs an action and a keybinding, and the count guards the other
  # direction: an empty sheet passes a test that only asks what entries
  # look like. 45 in the default mode today; the modes' own keys (#89) take
  # it to 66.
  #
  # help-keys is the held-keys window, open all session and empty until a
  # modifier is down. Nothing here can hold a key, so the check is that it
  # opened and that its watcher reports the resting state: nothing to show.
  assert:
    - test "$(eww get help-sheet | jq '[.[] | select(.mode == "default")] | length')" -ge 40
    - eww get help-sheet | jq -e 'all(.action != "" and .keybinding != "")'
    - eww active-windows | grep -qx 'help-keys: help-keys'
    - eww get help-held | jq -e '.show == false'
  after:
    - /usr/share/sway/scripts/help.sh --toggle
