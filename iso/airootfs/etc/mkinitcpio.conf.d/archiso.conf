# memdisk is absent from releng's list here: that hook needs memdiskfind
# from syslinux, and memdisk itself is a syslinux BIOS module. This ISO
# boots systemd-boot on UEFI only, so the hook could never fire - and
# without syslinux installed its absence fails the initramfs build.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
