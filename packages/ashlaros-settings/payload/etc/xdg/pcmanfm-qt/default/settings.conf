# pcmanfm-qt's own "Open Terminal Here", which is separate from libfm-qt's
# Terminal=true handling in ../../../usr/share/libfm-qt/terminals.list -
# both default to xterm, and we ship no xterm.
#
# settings.cpp: setTerminal(settings.value("Terminal", "xterm")), and
# profileDir() falls back from the user's own config directory to the
# system ones, so this file is what a user without a profile gets.
#
# /etc/xdg rather than etc/skel deliberately: skel only reaches accounts
# created after it ships, while this is the fallback for everyone who has
# no profile of their own - including machines installed before it
# existed. pcmanfm-qt writes its own copy on first exit, so this seeds
# rather than overrides.
[System]
Terminal=xdg-terminal-exec
