name: build-image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Upload the image to R2. Leave off unless the artefact has been
          booted on a real Pi 5 - see the note in the publish step.
        type: boolean
        default: false

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    # Native, not emulated. build-wave.yml already documents why: makepkg
    # under qemu is slow enough to change what a build costs, and this
    # does considerably more work than one package.
    runs-on: ubuntu-24.04-arm
    env:
      QEMU_VERSION: '10.1.0'
      QEMU_PREFIX: ${{ github.workspace }}/.qemu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tools
        # parted, losetup, mkfs.vfat and bsdtar run on the runner rather
        # than in a container: the build needs loop devices, and a
        # container that can use them is a container with --privileged and
        # /dev passed through, which is the host with extra steps.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            parted dosfstools e2fsprogs libarchive-tools arch-install-scripts \
            xz-utils curl mtools fdisk

      - id: version
        run: echo "value=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: build the image
        run: sudo -E ./image/build-image.sh out "${{ steps.version.outputs.value }}"

      - name: cache qemu ${{ env.QEMU_VERSION }}
        id: cache-qemu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.QEMU_PREFIX }}
          key: qemu-${{ env.QEMU_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: build qemu (cache miss)
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        # Ubuntu 24.04 ships QEMU 8.2.2, which predates -M raspi4b (QEMU
        # 9.0) - the boot test failed with "unsupported machine type"
        # until this was understood. manjaro-sway hit it first and builds
        # from source; only the aarch64-softmmu target is needed, which
        # lands around 50 MB and then caches.
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libslirp-dev \
            python3 python3-venv flex bison
          curl -fsSL "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz" | tar -xJ
          cd "qemu-${QEMU_VERSION}"
          ./configure \
            --prefix="${QEMU_PREFIX}" \
            --target-list=aarch64-softmmu \
            --enable-slirp \
            --disable-docs --disable-gtk --disable-sdl \
            --disable-curses --disable-tools
          make -j"$(nproc)"
          make install

      - name: prepend qemu to PATH
        run: echo "${QEMU_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: the image boots
        # A real boot of linux-rpi under -M raspi4b, the way manjaro-sway
        # does it: mtools pulls the kernel off the FAT partition with no
        # loop device, and QEMU boots it. QEMU has no raspi5 machine, so
        # this proves the kernel and the root filesystem and not the Pi 5
        # firmware - which is why publishing is still manual below.
        run: ./image/test-image.sh out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpi5-image-${{ steps.version.outputs.value }}
          path: out/*
          retention-days: 7
          if-no-files-found: error

      - name: upload to R2
        # Deliberately opt-in. The issue this implements is explicit: a
        # green CI run must not stand in for hardware, because -M virt
        # does not boot linux-rpi and cannot tell you the firmware
        # partition is right. Someone writes the artefact above to a card,
        # boots a Pi 5, and only then reruns this with publish=true.
        if: inputs.publish
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ashlaros-iso
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sudo apt-get install -y --no-install-recommends python3-boto3
          python3 scripts/upload_iso.py --iso-dir out --version "$VERSION"
