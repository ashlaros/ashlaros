# NetworkManager claims tailscale0 through its generic "assume an
# externally-created software device" path: link_can_assume() accepts any
# IFF_UP software link carrying a non-link-local address, which tailscale0
# becomes the moment tailscaled assigns the 100.x. The 2021 blow-up
# (tailscale#1875: "failure to start DHCP: missing MAC address", every
# address torn off the interface) was fixed on tailscale's side, but the
# assumption behaviour itself is unchanged.
#
# interface-name:tailscale* rather than type:tun, which would unmanage
# every tun device on the machine. Userspace-networking creates no
# interface at all, so matching nothing there is correct.
#
# `+=` rather than `=`: conf.d files merge asciibetically and last value
# wins, so a bare `=` in a 99- file would silently discard another
# snippet's list. Nothing else sets this today - future-proofing.
[keyfile]
unmanaged-devices+=interface-name:tailscale*
