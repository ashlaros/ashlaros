# gruvbox, light
#
# gruvbox-material's light palette at medium contrast, the counterpart of
# gruvbox/ and made the same way - see its theme.conf for the source, the
# $colorN layout and why GTK and Qt stay neutral. omarchy ships no light
# gruvbox; this is the one the day/night toggle needs to have a pair.
#
# The accent is the light palette's blue, #45707a, at 4.8:1 on this cream.
# The dark theme's #7daea3 would be 2.2:1, a focused border nobody finds.
# The mode banners' yellow keys are the weakest pair, 3.5:1 - bold text,
# which is what that threshold is for.

# some global theme specific variables
set $gtk-theme adw-gtk3
set $icon-theme Papirus-Light
set $cursor-theme phinger-cursors-dark
set $gui-font Roboto 11
set $term-font JetBrainsMono NF
set $gtk-color-scheme prefer-light
set $kvantum-theme KvGnome
set $vscode-theme "Noctis Lux"

set $bg0    #fbf1c7
set $bg1    #f4e8be
set $bg3    #eee0b7
set $bg5    #ddccab
set $fg0    #654735
set $grey0  #a89984
set $grey2  #7c6f64
set $red    #c14a4a
set $orange #c35e0a
set $yellow #b47109
set $green  #6c782e
set $aqua   #4c7a5d
set $blue   #45707a
set $purple #945e80

set $color0  $bg0
set $color1  $bg1
set $color3  $bg5
set $color5  $grey2
set $color6  $fg0
set $color7  #4f3829
set $color8  $red
set $color9  $orange
set $color10 $yellow
set $color11 $green
set $color12 $blue
set $color13 $aqua

set $background-color $bg0
set $text-color $fg0
set $selection-color $bg3
set $accent-color $blue

# target                 title   bg    text   indicator border
client.focused           $blue   $blue $bg0   $aqua     $blue
client.focused_inactive  $bg5    $bg3  $fg0   $bg5      $bg5
client.unfocused         $bg3    $bg0  $grey2 $bg5      $bg3
client.urgent            $red    $red  $bg0   $orange   $red
client.placeholder       $bg0    $bg0  $grey2 $bg0      $bg0
client.background        $bg0
