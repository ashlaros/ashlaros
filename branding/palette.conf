# The AshlarOS palette. Carried over from manjaro-sway's design language
# (sway-repo/_layouts/default.html) with the Manjaro green replaced:
# #141a1b, #282828 and #eee carry the brutalism and are not Manjaro-owned.
#
# Shell-sourceable and readable by anything that parses KEY=value.

# the topbar, the ISO's background field, and any inset panel
ASHLAROS_BASE=#141a1b
# the page behind content
ASHLAROS_SURFACE=#282828
# body text and the mark's dressed stone
ASHLAROS_FOREGROUND=#eee
# the accent, in place of manjaro's #16a085
ASHLAROS_ACCENT=#8a8f98
# the accent one step brighter, for hover and selection
ASHLAROS_HIGHLIGHT=#c9ccd1
